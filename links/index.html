<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-top: #1a1a2e;
    --bg-bot: #16213e;
    --accent: #e8c4d0;
    --accent2: #c9a8bc;
    --card: rgba(255,255,255,0.10);
    --card-hover: rgba(255,255,255,0.17);
    --card-border: rgba(255,255,255,0.13);
    --text: #f5f0f2;
    --text-muted: rgba(245,240,242,0.55);
    --radius: 14px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }

  body {
    background: linear-gradient(160deg, #1a1a2e 0%, #2d1b3d 45%, #1a2a3a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 3rem 1.25rem 4rem;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Avatar ── */
  .avatar-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), #a8c4d4);
    margin-bottom: 1rem;
    flex-shrink: 0;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #2d1b3d;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .avatar-fallback {
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--accent);
    display: none;
  }

  /* ── Header text ── */
  .name {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 0.3rem;
    text-align: center;
  }

  .handle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
    text-align: center;
  }

  .tagline {
    font-size: 0.82rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 2rem;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.02em;
  }

  /* ── Buttons ── */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    width: 100%;
    padding: 0.9rem 1.25rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    position: relative;
  }

  .btn:hover {
    background: var(--card-hover);
    border-color: rgba(232, 196, 208, 0.4);
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-icon svg {
    width: 19px;
    height: 19px;
  }

  .btn-label {
    flex: 1;
    text-align: center;
  }

  /* WhatsApp highlight */
  .btn-wa {
    background: rgba(37, 211, 102, 0.12);
    border-color: rgba(37, 211, 102, 0.25);
  }
  .btn-wa:hover {
    background: rgba(37, 211, 102, 0.2);
    border-color: rgba(37, 211, 102, 0.5);
  }

  /* ── Footer ── */
  .footer {
    margin-top: 2.5rem;
    font-size: 0.7rem;
    color: rgba(245,240,242,0.25);
    letter-spacing: 0.08em;
    text-align: center;
  }
</style>
